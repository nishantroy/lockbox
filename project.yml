name: PhoneLockbox
configFiles:
  Debug: Config/Lockbox.xcconfig
  Release: Config/Lockbox.xcconfig
options:
  bundleIdPrefix: com.phone-lockbox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "28"
packages:
  AmbientKit:
    path: AmbientKit
  CompanionKit:
    path: CompanionKit
targets:
  PhoneLockbox:
    type: application
    platform: iOS
    sources:
      - path: PhoneLockbox
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phone-lockbox.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PhoneLockbox/PhoneLockbox.entitlements
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: PhoneLockbox/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.phone-lockbox.app.quick-actions
            CFBundleURLSchemes:
              - phonelockbox
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.phone-lockbox.app.companion
            CFBundleURLSchemes:
              - phone-lockbox-companion
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LockboxRelayBaseURL: $(LOCKBOX_RELAY_BASE_URL)
    dependencies:
      - sdk: AppIntents.framework
      - package: AmbientKit
      - package: CompanionKit
      - target: LockboxLiveActivity
        embed: true
      - target: DeviceActivityMonitor
        embed: true
      - target: ShieldConfiguration
        embed: true
      - target: ShieldAction
        embed: true
  LockboxLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/LockboxLiveActivity
    dependencies:
      - package: AmbientKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phone-lockbox.app.live-activity
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Extensions/LockboxLiveActivity/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  PhoneLockboxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhoneLockboxTests
    dependencies:
      - target: PhoneLockbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phone-lockbox.tests
        GENERATE_INFOPLIST_FILE: YES
  PhoneLockboxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PhoneLockboxUITests
    dependencies:
      - target: PhoneLockbox
      - package: CompanionKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phone-lockbox.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PhoneLockbox
  DeviceActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/DeviceActivityMonitor
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phone-lockbox.app.monitor
        CODE_SIGN_ENTITLEMENTS: Extensions/DeviceActivityMonitor/PhoneLockboxMonitor.entitlements
        INFOPLIST_FILE: Extensions/DeviceActivityMonitor/Info.plist
        SKIP_INSTALL: YES
  ShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldConfiguration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phone-lockbox.app.shield-configuration
        CODE_SIGN_ENTITLEMENTS: Extensions/ShieldConfiguration/PhoneLockboxShieldConfiguration.entitlements
        INFOPLIST_FILE: Extensions/ShieldConfiguration/Info.plist
        SKIP_INSTALL: YES
  ShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldAction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phone-lockbox.app.shield-action
        CODE_SIGN_ENTITLEMENTS: Extensions/ShieldAction/PhoneLockboxShieldAction.entitlements
        INFOPLIST_FILE: Extensions/ShieldAction/Info.plist
        SKIP_INSTALL: YES
schemes:
  PhoneLockbox:
    build:
      targets:
        PhoneLockbox: all
        PhoneLockboxTests: [test]
        PhoneLockboxUITests: [test]
    test:
      targets:
        - PhoneLockboxTests
        # Review P2-4: PhoneLockboxUITests is deliberately NOT a test
        # target of this scheme (tried `skipped: true` first — Xcode
        # refused `-only-testing:PhoneLockboxUITests` against it with
        # "isn't a member of the specified test plan or scheme", so a
        # skipped testable does not actually make -only-testing override
        # it in this Xcode version). It has its own PhoneLockboxUITests
        # scheme below instead. A bare `xcodebuild test -scheme
        # PhoneLockbox` therefore only ever runs PhoneLockboxTests and
        # never needs a local relay. See docs/development.md for how to
        # run the UI tests deliberately.

  PhoneLockboxUITests:
    build:
      targets:
        PhoneLockbox: all
        PhoneLockboxUITests: [test]
    test:
      targets:
        - PhoneLockboxUITests
