name: PhoneLockbox
options:
  bundleIdPrefix: com.phone-lockbox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "14"
    DEVELOPMENT_TEAM: ""
packages:
  AmbientKit:
    path: AmbientKit
targets:
  PhoneLockbox:
    type: application
    platform: iOS
    sources:
      - path: PhoneLockbox
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phone-lockbox.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: PhoneLockbox/PhoneLockbox.entitlements
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: PhoneLockbox/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.phone-lockbox.app.quick-actions
            CFBundleURLSchemes:
              - phonelockbox
    dependencies:
      - sdk: AppIntents.framework
      - package: AmbientKit
      - target: LockboxLiveActivity
        embed: true
      - target: DeviceActivityMonitor
        embed: true
      - target: ShieldConfiguration
        embed: true
      - target: ShieldAction
        embed: true
  LockboxLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/LockboxLiveActivity
    dependencies:
      - package: AmbientKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phone-lockbox.app.live-activity
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Extensions/LockboxLiveActivity/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  PhoneLockboxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhoneLockboxTests
    dependencies:
      - target: PhoneLockbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phone-lockbox.tests
        GENERATE_INFOPLIST_FILE: YES
  DeviceActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/DeviceActivityMonitor
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phone-lockbox.app.monitor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: Extensions/DeviceActivityMonitor/PhoneLockboxMonitor.entitlements
        INFOPLIST_FILE: Extensions/DeviceActivityMonitor/Info.plist
        SKIP_INSTALL: YES
  ShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldConfiguration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phone-lockbox.app.shield-configuration
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: Extensions/ShieldConfiguration/PhoneLockboxShieldConfiguration.entitlements
        INFOPLIST_FILE: Extensions/ShieldConfiguration/Info.plist
        SKIP_INSTALL: YES
  ShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldAction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phone-lockbox.app.shield-action
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: Extensions/ShieldAction/PhoneLockboxShieldAction.entitlements
        INFOPLIST_FILE: Extensions/ShieldAction/Info.plist
        SKIP_INSTALL: YES
schemes:
  PhoneLockbox:
    build:
      targets:
        PhoneLockbox: all
        PhoneLockboxTests: [test]
    test:
      targets:
        - PhoneLockboxTests
